name: Library Index Sync

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6 AM
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "config/library-taxonomy.json"

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild prompt library index
        shell: pwsh
        run: |
          & ./scripts/tag-library.ps1 -LibraryRoot "./prompts" -TaxonomyConfig "./config/library-taxonomy.json"

      - name: Commit updated index
        run: |
          git config user.name "coe-bot"
          git config user.email "coe@cherrybekaert.com"
          git add prompts/prompt-library-index.json
          git diff --staged --quiet || git commit -m "chore: auto-sync prompt library index [skip ci]"
          git push
